[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "logworthy"
version = "0.1.0"
description = "Can your log support a policy? An action-outcome coupling audit for offline reinforcement learning."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
    { name = "Tung Dang" },
    { name = "The Hung Phung" },
    { name = "Son Lam Nguyen" },
    { name = "Tu Nguyen" },
]
keywords = [
    "offline reinforcement learning",
    "off-policy evaluation",
    "causal inference",
    "decision support",
    "effect size",
    "cluster bootstrap",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
]
examples = [
    "pandas>=1.3",
    "scikit-learn>=1.0",
]
rl = [
    "scikit-learn>=1.0",
    "d3rlpy>=2.0",
    "torch>=1.13",
]

[project.urls]
Homepage = "https://github.com/LogWorthy/LogWorthy"
Paper = "https://doi.org/10.48550/arXiv.2607.11269"
Issues = "https://github.com/LogWorthy/LogWorthy/issues"

[tool.setuptools.packages.find]
include = ["logworthy*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 90
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E741",  # `I` is the paper's reason code for failed overlap
    "B008",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
